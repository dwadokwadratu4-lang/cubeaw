<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Test AR - Wyłanianie 3D | Artur Wierzbicki</title>
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* Ekran powitalny na wierzchu */
      .start-overlay {
        position: fixed;
        inset: 0;
        background: #1b4332;
        color: #f4f1ea;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        z-index: 9999;
      }
      .start-btn {
        background: #f4a261;
        color: #1b4332;
        border: none;
        padding: 16px 28px;
        font-size: 16px;
        font-weight: 800;
        border-radius: 14px;
        margin-top: 20px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
      .header-badge {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 30, 25, 0.85);
        color: #f4f1ea;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        z-index: 100;
        white-space: nowrap;
      }
      .controls {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 380px;
        background: rgba(255, 255, 255, 0.92);
        padding: 14px 18px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        z-index: 100;
        text-align: center;
      }
      .controls label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        color: #1b4332;
        margin-bottom: 8px;
      }
      input[type="range"] {
        width: 100%;
        height: 8px;
        accent-color: #2d6a4f;
        cursor: pointer;
      }
    </style>
    <script>
      AFRAME.registerComponent('cloak', {
        init: function () {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) mesh.material.colorWrite = false;
        }
      });

      AFRAME.registerComponent('multi-color-box', {
        init: function () {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            const colors = [0xe63946, 0x2a9d8f, 0xf4a261, 0x264653, 0x457b9d, 0xe9c46a];
            mesh.material = colors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4 }));
          }
        }
      });
    </script>
  </head>
  <body>
    <!-- Zielona kurtyna startowa -->
    <div id="startOverlay" class="start-overlay">
      <div style="font-size: 13px; opacity: 0.8;">Projekt i realizacja: Artur Wierzbicki</div>
      <h2 style="margin: 8px 0;">Test WebAR 3D</h2>
      <p style="font-size: 14px; max-width: 300px; line-height: 1.4;">
        Uprawnienia kamery są już aktywne. Kliknij poniżej i skieruj telefon na znacznik <b>HIRO</b>.
      </p>
      <button id="startBtn" class="start-btn">ODSŁOŃ KAMERĘ AR</button>
    </div>

    <div class="header-badge">WebAR Test | Artur Wierzbicki</div>

    <div class="controls">
      <label for="emergeSlider">Wysunięcie obiektu: <span id="percentText">50</span>%</label>
      <input type="range" id="emergeSlider" min="0" max="100" value="50" />
    </div>

    <!-- Scena AR obecna w kodzie od samego startu strony -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" position="1 3 2" intensity="0.9"></a-light>

      <a-marker preset="hiro">
        <a-plane position="0 0 -2.5" rotation="-90 0 0" width="10" height="4" cloak></a-plane>
        <a-plane position="0 0 2.5" rotation="-90 0 0" width="10" height="4" cloak></a-plane>
        <a-plane position="-2.5 0 0" rotation="-90 0 0" width="4" height="1" cloak></a-plane>
        <a-plane position="2.5 0 0" rotation="-90 0 0" width="4" height="1" cloak></a-plane>

        <a-box id="arCube" position="0 0 0" width="1" height="1" depth="1" multi-color-box></a-box>
      </a-marker>

      
    </a-scene>

    <script>
      const startBtn = document.getElementById('startBtn');
      const startOverlay = document.getElementById('startOverlay');
      const slider = document.getElementById('emergeSlider');
      const percentText = document.getElementById('percentText');
      const cube = document.getElementById('arCube');

      function updateCubePosition(val) {
        percentText.textContent = val;
        const yPos = -0.501 + (val / 100) * 1.001;
        cube.setAttribute('position', `0 ${yPos.toFixed(3)} 0`);
      }

      updateCubePosition(50);

      slider.addEventListener('input', (e) => {
        updateCubePosition(e.target.value);
      });

      startBtn.addEventListener('click', () => {
        startOverlay.style.display = 'none';
        // Wymuszenie odświeżenia rozmiaru okna dla AR.js po zdjęciu kurtyny
        window.dispatchEvent(new Event('resize'));
      });
    </script>
  </body>
</html>

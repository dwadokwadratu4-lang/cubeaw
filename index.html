<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Test AR - Wyłanianie 3D | Artur Wierzbicki</title>
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        z-index: -2 !important;
      }
      canvas.a-canvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        z-index: -1 !important;
      }
      /* Ekran startowy wymuszający pytanie o zgodę na kamerę */
      .start-overlay {
        position: fixed;
        inset: 0;
        background: #1b4332;
        color: #f4f1ea;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        z-index: 999;
      }
      .start-btn {
        background: #f4a261;
        color: #1b4332;
        border: none;
        padding: 16px 28px;
        font-size: 16px;
        font-weight: 800;
        border-radius: 14px;
        margin-top: 20px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
      .error-box {
        margin-top: 16px;
        background: rgba(211, 47, 47, 0.9);
        padding: 12px;
        border-radius: 10px;
        font-size: 13px;
        display: none;
        max-width: 320px;
      }
      .header-badge {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 30, 25, 0.85);
        color: #f4f1ea;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        z-index: 100;
        white-space: nowrap;
      }
      .controls {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 380px;
        background: rgba(255, 255, 255, 0.92);
        padding: 14px 18px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        z-index: 100;
        text-align: center;
      }
      .controls label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        color: #1b4332;
        margin-bottom: 8px;
      }
      input[type="range"] {
        width: 100%;
        height: 8px;
        accent-color: #2d6a4f;
        cursor: pointer;
      }
    </style>
    <script>
      AFRAME.registerComponent('cloak', {
        init: function () {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) mesh.material.colorWrite = false;
        }
      });

      AFRAME.registerComponent('multi-color-box', {
        init: function () {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            const colors = [0xe63946, 0x2a9d8f, 0xf4a261, 0x264653, 0x457b9d, 0xe9c46a];
            mesh.material = colors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4 }));
          }
        }
      });
    </script>
  </head>
  <body>
    <!-- Ekran startowy -->
    <div id="startOverlay" class="start-overlay">
      <div style="font-size: 13px; opacity: 0.8;">Projekt i realizacja: Artur Wierzbicki</div>
      <h2 style="margin: 8px 0;">Test WebAR 3D</h2>
      <p style="font-size: 14px; max-width: 300px; line-height: 1.4;">
        Kliknij przycisk poniżej, aby włączyć tylną kamerę i skieruj ją na znacznik <b>HIRO</b>.
      </p>
      <button id="startBtn" class="start-btn">URUCHOM KAMERĘ AR</button>
      <div id="errorBox" class="error-box"></div>
    </div>

    <div class="header-badge">WebAR Test | Artur Wierzbicki</div>

    <div class="controls">
      <label for="emergeSlider">Wysunięcie obiektu: <span id="percentText">50</span>%</label>
      <input type="range" id="emergeSlider" min="0" max="100" value="50" />
    </div>

    <div id="arContainer"></div>

    <script>
      const startBtn = document.getElementById('startBtn');
      const startOverlay = document.getElementById('startOverlay');
      const errorBox = document.getElementById('errorBox');
      const slider = document.getElementById('emergeSlider');
      const percentText = document.getElementById('percentText');
      const arContainer = document.getElementById('arContainer');

      function updateCubePosition(val) {
        percentText.textContent = val;
        const cube = document.getElementById('arCube');
        if (cube) {
          const yPos = -0.501 + (val / 100) * 1.001;
          cube.setAttribute('position', `0 ${yPos.toFixed(3)} 0`);
        }
      }

      slider.addEventListener('input', (e) => {
        updateCubePosition(e.target.value);
      });

      // Wymuszenie zapytania o kamerę po kliknięciu przycisku
      startBtn.addEventListener('click', async () => {
        errorBox.style.display = 'none';
        try {
          // Najpierw wymuszamy systemowe okno z pytaniem o dostęp do tylnej kamery
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });
          // Zatrzymujemy strumień testowy, aby AR.js mógł go przejąć
          stream.getTracks().forEach(track => track.stop());

          // Wstrzykujemy scenę AR dopiero po uzyskaniu zgody
          arContainer.innerHTML = `
            <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;" renderer="antialias: true; alpha: true;">
              <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
              <a-light type="directional" position="1 3 2" intensity="0.9"></a-light>
              <a-marker preset="hiro">
                <a-plane position="0 0 -2.5" rotation="-90 0 0" width="10" height="4" cloak></a-plane>
                <a-plane position="0 0 2.5" rotation="-90 0 0" width="10" height="4" cloak></a-plane>
                <a-plane position="-2.5 0 0" rotation="-90 0 0" width="4" height="1" cloak></a-plane>
                <a-plane position="2.5 0 0" rotation="-90 0 0" width="4" height="1" cloak></a-plane>
                <a-box id="arCube" position="0 0 0" width="1" height="1" depth="1" multi-color-box></a-box>
              </a-marker>
              
            </a-scene>
          `;
          startOverlay.style.display = 'none';
          setTimeout(() => updateCubePosition(slider.value), 500);
        } catch (err) {
          errorBox.style.display = 'block';
          errorBox.innerHTML = `<b>Odmowa dostępu (${err.name}):</b><br>1. Otwórz link bezpośrednio w aplikacji <b>Google Chrome</b>.<br>2. Kliknij ikonę suwaków po lewej stronie paska adresu u góry -> <b>Uprawnienia</b> -> włącz <b>Aparat</b>.`;
        }
      });
    </script>
  </body>
</html>

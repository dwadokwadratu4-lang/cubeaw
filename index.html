<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Test MindAR - Wyłanianie 3D | Artur Wierzbicki</title>
    <!-- Nowoczesne biblioteki A-Frame + MindAR (niezawodne na Androidzie) -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .header-badge {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 30, 25, 0.85);
        color: #f4f1ea;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        z-index: 100;
        white-space: nowrap;
      }
      .controls {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 380px;
        background: rgba(255, 255, 255, 0.92);
        padding: 14px 18px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        z-index: 100;
        text-align: center;
      }
      .controls label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        color: #1b4332;
        margin-bottom: 8px;
      }
      input[type="range"] {
        width: 100%;
        height: 8px;
        accent-color: #2d6a4f;
        cursor: pointer;
      }
    </style>
    <script>
      AFRAME.registerComponent('cloak', {
        init: function () {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) mesh.material.colorWrite = false;
        }
      });

      AFRAME.registerComponent('multi-color-box', {
        init: function () {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            const colors = [0xe63946, 0x2a9d8f, 0xf4a261, 0x264653, 0x457b9d, 0xe9c46a];
            mesh.material = colors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4 }));
          }
        }
      });
    </script>
  </head>
  <body>
    <div class="header-badge">MindAR 3D | Artur Wierzbicki</div>

    <div class="controls">
      <label for="emergeSlider">Wysunięcie obiektu: <span id="percentText">50</span>%</label>
      <input type="range" id="emergeSlider" min="0" max="100" value="50" />
    </div>

    <!-- Scena MindAR z wbudowanym przykładowym znacznikiem -->
    <a-scene
      mindar-image="imageTargetSrc: https://jsdelivr.net;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
      <a-light type="directional" position="1 3 2" intensity="0.9"></a-light>

      <!-- Cel śledzenia (znacznik) -->
      
        <!-- Niewidzialna maska wokół znacznika (ukrywa sześcian pod płaszczyzną) -->
        <a-plane position="0 1.25 0" width="4" height="2" cloak></a-plane>
        <a-plane position="0 -1.25 0" width="4" height="2" cloak></a-plane>
        <a-plane position="-1.25 0 0" width="2" height="0.5" cloak></a-plane>
        <a-plane position="1.25 0 0" width="2" height="0.5" cloak></a-plane>

        <!-- Wielokolorowy sześcian 3D -->
        <a-box id="arCube" position="0 0 0" width="0.5" height="0.5" depth="0.5" multi-color-box></a-box>
      
    </a-scene>

    <script>
      const slider = document.getElementById('emergeSlider');
      const percentText = document.getElementById('percentText');
      const cube = document.getElementById('arCube');

      function updateCubePosition(val) {
        percentText.textContent = val;
        // W MindAR oś Z wychodzi z obrazka w stronę kamery (0.25 to połowa wysokości sześcianu 0.5)
        const zPos = -0.251 + (val / 100) * 0.502;
        cube.setAttribute('position', `0 0 ${zPos.toFixed(3)}`);
      }

      updateCubePosition(50);

      slider.addEventListener('input', (e) => {
        updateCubePosition(e.target.value);
      });
    </script>
  </body>
</html>

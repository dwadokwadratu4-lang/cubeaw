<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Test AR - Wyłanianie 3D | Artur Wierzbicki</title>
    <!-- Stabilne wersje bibliotek A-Frame oraz AR.js z jsDelivr -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* Wymuszenie pełnego ekranu dla wideo z kamery */
      video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        z-index: -2 !important;
      }
      canvas.a-canvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        z-index: -1 !important;
      }
      /* Górny pasek podpisu */
      .header-badge {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 30, 25, 0.85);
        color: #f4f1ea;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        z-index: 100;
        white-space: nowrap;
      }
      /* Komunikat statusu kamery (gdyby była zablokowana) */
      .status-msg {
        position: fixed;
        top: 48px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(211, 47, 47, 0.9);
        color: #ffffff;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 11px;
        z-index: 100;
        text-align: center;
        max-width: 85%;
        display: none;
      }
      /* Dolny panel z suwakiem pod kciuk */
      .controls {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 380px;
        background: rgba(255, 255, 255, 0.92);
        padding: 14px 18px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        z-index: 100;
        text-align: center;
      }
      .controls label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        color: #1b4332;
        margin-bottom: 8px;
      }
      input[type="range"] {
        width: 100%;
        height: 8px;
        accent-color: #2d6a4f;
        cursor: pointer;
      }
    </style>
    <script>
      AFRAME.registerComponent('cloak', {
        init: function () {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.material.colorWrite = false;
          }
        }
      });

      AFRAME.registerComponent('multi-color-box', {
        init: function () {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            const colors = [
              0xe63946, // Prawa - Czerwony
              0x2a9d8f, // Lewa - Turkusowy
              0xf4a261, // Góra - Pomarańczowy
              0x264653, // Dół - Ciemny granat
              0x457b9d, // Przód - Niebieski
              0xe9c46a  // Tył - Żółty
            ];
            mesh.material = colors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4 }));
          }
        }
      });
    </script>
  </head>
  <body>
    <div class="header-badge">WebAR Test | Artur Wierzbicki</div>
    <div id="statusMsg" class="status-msg"></div>

    <!-- Interfejs suwaka na dole ekranu -->
    <div class="controls">
      <label for="emergeSlider">Wysunięcie obiektu: <span id="percentText">50</span>%</label>
      <input type="range" id="emergeSlider" min="0" max="100" value="50" />
    </div>

    <!-- Scena AR z wymuszeniem tylnej kamery -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;"
      renderer="antialias: true; alpha: true;"
    >
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" position="1 3 2" intensity="0.9"></a-light>

      <a-marker preset="hiro">
        <a-plane position="0 0 -2.5" rotation="-90 0 0" width="10" height="4" cloak></a-plane>
        <a-plane position="0 0 2.5" rotation="-90 0 0" width="10" height="4" cloak></a-plane>
        <a-plane position="-2.5 0 0" rotation="-90 0 0" width="4" height="1" cloak></a-plane>
        <a-plane position="2.5 0 0" rotation="-90 0 0" width="4" height="1" cloak></a-plane>

        <a-box id="arCube" position="0 0 0" width="1" height="1" depth="1" multi-color-box></a-box>
      </a-marker>

      
    </a-scene>

    <script>
      const slider = document.getElementById('emergeSlider');
      const percentText = document.getElementById('percentText');
      const cube = document.getElementById('arCube');
      const statusMsg = document.getElementById('statusMsg');

      function updateCubePosition(val) {
        percentText.textContent = val;
        const yPos = -0.501 + (val / 100) * 1.001;
        cube.setAttribute('position', `0 ${yPos.toFixed(3)} 0`);
      }

      updateCubePosition(50);

      slider.addEventListener('input', (e) => {
        updateCubePosition(e.target.value);
      });

      // Sprawdzenie uprawnień kamery w przeglądarce
      window.addEventListener('arjs-video-loaded', () => {
        statusMsg.style.display = 'none';
      });

      setTimeout(() => {
        const video = document.querySelector('video');
        if (!video || video.readyState === 0) {
          statusMsg.style.display = 'block';
          statusMsg.textContent = 'Brak obrazu z kamery. Kliknij ikonę ustawień obok adresu strony u góry i zezwól na dostęp do aparatu, a następnie odśwież.';
        }
      }, 4000);
    </script>
  </body>
</html>
